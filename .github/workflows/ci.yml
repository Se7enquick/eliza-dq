name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dialect:
        description: "Which integration tests to run"
        type: choice
        default: all
        options:
          - all
          - postgres
          - mysql
          - duckdb
          - polars

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest tests/ -v --tb=short --ignore=tests/integration

  integration-postgres:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.dialect == 'all' ||
      github.event.inputs.dialect == 'postgres'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eliza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres,test]"
      - run: pytest tests/integration/test_postgres.py -v --tb=short
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eliza_test

  integration-mysql:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.dialect == 'all' ||
      github.event.inputs.dialect == 'mysql'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eliza_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[mysql,test]"
      - run: pytest tests/integration/test_mysql.py -v --tb=short
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: eliza_test

  integration-duckdb:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.dialect == 'all' ||
      github.event.inputs.dialect == 'duckdb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest tests/integration/test_duckdb.py -v --tb=short

  integration-polars:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.dialect == 'all' ||
      github.event.inputs.dialect == 'polars'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest tests/integration/test_polars.py -v --tb=short
